<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>المدرس الخصوصي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المدرس">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Playpen+Sans+Arabic:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f172a; --panel:#111c33; --line:#22304d; --ink:#e5e7eb; --muted:#94a3b8;
  --accent:#22c55e; --accent2:#38bdf8;
  --board:#fcfcf9; --frame:#c9d1d9;
  --m-black:#1f2430; --m-blue:#1d4ed8; --m-red:#c8232c; --m-green:#14803c;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;max-width:100vw}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
/* header */
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#16a34a,#0ea5e9);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:15px;font-weight:700}
.ttl small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#64748b}
.dot.live{background:var(--accent);box-shadow:0 0 0 3px #22c55e33;animation:pulse 1.2s infinite}
.dot.think{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.hbtn{background:#1a2744;border:1px solid var(--line);color:var(--ink);border-radius:10px;height:36px;padding:0 12px;display:flex;align-items:center;gap:6px;font-size:13px}
.hbtn svg{width:18px;height:18px}
.hbtn.icon{width:36px;padding:0;justify-content:center}
/* board */
.wrap{flex:1;min-height:0;padding:10px;display:flex}
#board{flex:1;overflow-y:auto;background:var(--board);border-radius:14px;border:8px solid var(--frame);
  box-shadow:inset 0 0 40px #0000000d,0 10px 30px #00000055;
  background-image:linear-gradient(#e9eef3 1px,transparent 1px),linear-gradient(90deg,#e9eef3 1px,transparent 1px);background-size:28px 28px;
  color:var(--m-black);font-family:"Playpen Sans Arabic",cursive;font-weight:400;padding:18px 18px 40px;scroll-behavior:smooth;position:relative}
#pen{position:absolute;width:30px;height:30px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:3;filter:drop-shadow(1px 2px 1px #0003)}
#pen.on{opacity:1}
.empty{font-family:"IBM Plex Sans Arabic",sans-serif;max-width:560px;margin:4vh auto 0;text-align:center;color:#334155}
.empty h2{font-family:"Playpen Sans Arabic";font-size:26px;margin:6px 0 4px;color:var(--m-blue)}
.empty p{margin:0 0 18px;color:#64748b;font-size:14px;line-height:1.7}
.ex{display:flex;flex-direction:column;gap:8px}
.ex button{background:#fff;border:1.5px dashed #cbd5e1;border-radius:12px;padding:11px 14px;text-align:right;font-size:14px;color:#1e293b;line-height:1.6}
.ex button:active{background:#f1f5f9}
.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px;font-family:"IBM Plex Sans Arabic"}
/* lesson */
.lesson{max-width:820px;margin:0 auto 28px}
.qhead{font-family:"IBM Plex Sans Arabic";background:#eef6ff;border-right:4px solid var(--m-blue);border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:14px;color:#1e3a8a;line-height:1.7;white-space:pre-wrap}
.qhead.follow{background:#f0fdf4;border-color:var(--m-green);color:#14532d}
.qhead img{display:block;max-width:180px;max-height:140px;border-radius:6px;margin-top:8px;border:1px solid #cbd5e1}
.step{position:relative;padding:4px 6px 4px 6px;margin-bottom:10px;border-radius:10px;transition:background .3s}
.step.now{background:#fffbea}
.step .num{position:absolute;right:-4px;top:6px;width:22px;height:22px;border-radius:50%;border:1.8px solid #94a3b8;color:#64748b;font-size:12px;display:grid;place-items:center;font-family:"IBM Plex Sans Arabic";opacity:0;transition:opacity .3s}
.step.shown .num{opacity:1}
.step .body{padding-right:28px}
.w{opacity:0;display:inline-block}
.w.on{opacity:1}
.blk{transform:rotate(var(--rot,0deg))}
.blk{margin:6px 0}
.h{font-size:28px;font-weight:700;color:var(--m-blue);display:inline-block;position:relative;padding-bottom:6px}
.h svg{position:absolute;right:0;bottom:-2px;width:100%;height:10px;overflow:visible}
.h path{fill:none;stroke:var(--m-red);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:320;stroke-dashoffset:320;transition:stroke-dashoffset .7s ease}
.h svg.on path{stroke-dashoffset:0}
.t{font-size:22px;line-height:2}
.c-blue{color:var(--m-blue)} .c-red{color:var(--m-red)} .c-green{color:var(--m-green)} .c-black{color:var(--m-black)}
ul.l{margin:2px 0;padding-right:22px;font-size:21px;line-height:2}
ul.l li::marker{color:var(--m-red)}
.m{direction:ltr;text-align:left;font-size:23px;color:var(--m-blue);font-weight:700;letter-spacing:.3px;background:transparent;border-radius:8px;padding:6px 12px;display:inline-block;max-width:100%;unicode-bidi:plaintext}
.box{border:2.5px solid transparent;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;padding:10px 14px;font-size:21px;line-height:1.9;display:inline-block;max-width:100%;transition:border-color .5s}
.box.on{border-color:var(--m-red)}
.box .tag{font-size:16px;color:var(--m-red);display:block;font-weight:700}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .node{border:2px solid var(--m-blue);border-radius:12px 4px 12px 4px;padding:6px 10px;font-size:19px;background:transparent}
.flow .arr{color:var(--m-red);font-size:22px;font-weight:700}
table.tb,table.jr{border-collapse:collapse;font-size:19px;background:transparent;margin:4px 0;max-width:100%}
.tbwrap{overflow-x:auto;max-width:100%}
table.tb th,table.tb td,table.jr th,table.jr td{border:1.6px solid #475569;padding:6px 10px;text-align:center}
table.tb th,table.jr th{color:var(--m-blue);background:transparent;font-weight:700}
table.jr td.acct{text-align:right;min-width:170px}
table.jr td.acct.cr{padding-right:34px}
table.jr td.num{direction:ltr;font-weight:600;min-width:90px}
.memo{font-size:18px;color:#475569;margin-top:2px}
.tac{display:inline-block;min-width:280px;max-width:100%;margin:4px 0}
.tac .tt{text-align:center;font-size:18px;color:var(--m-blue);font-weight:700;border-bottom:2.5px solid var(--m-black);padding-bottom:3px}
.tac .cols{display:grid;grid-template-columns:1fr 1fr}
.tac .col{padding:4px 8px;min-height:40px}
.tac .col:first-child{border-left:2.5px solid var(--m-black)}
.tac .side{font-size:15px;color:#64748b;margin-bottom:2px}
.tac .row{display:flex;justify-content:space-between;gap:8px;font-size:18px;line-height:1.8}
.tac .row .n{direction:ltr;font-weight:600}
.tac .bal{text-align:center;font-size:14px;color:var(--m-green);margin-top:4px;font-weight:600}
.opts{list-style:none;padding:0;margin:4px 0}
.opts li{position:relative;font-size:21px;line-height:1.8;padding:2px 10px;margin:3px 0;display:table}
.opts .strike{position:absolute;right:0;top:52%;height:2.5px;background:var(--m-red);width:0;transition:width .5s ease;border-radius:2px}
.opts .strike.on{width:100%}
.opts .ring{position:absolute;inset:-3px -6px;border:2.5px solid transparent;border-radius:50% 45% 50% 45%/60% 50% 60% 50%;transition:border-color .5s}
.opts .ring.on{border-color:var(--m-green)}
.opts li.wrong span.w{color:#64748b}
.ans{border:3px solid transparent;border-radius:16px 6px 16px 6px;padding:10px 16px;font-size:24px;font-weight:700;color:var(--m-green);display:inline-block;max-width:100%;background:transparent;transition:border-color .5s}
.ans.on{border-color:var(--m-green)}
.ans .ck{font-size:22px;margin-left:6px}
.thinking{display:flex;align-items:center;gap:10px;color:#64748b;font-family:"IBM Plex Sans Arabic";font-size:14px;padding:8px 4px}
.marker{width:34px;height:8px;position:relative}
.marker i{position:absolute;top:0;width:8px;height:8px;border-radius:50%;background:var(--m-blue);animation:bounce 1s infinite}
.marker i:nth-child(2){right:13px;animation-delay:.15s;background:var(--m-red)}
.marker i:nth-child(3){right:26px;animation-delay:.3s;background:var(--m-green)}
@keyframes bounce{50%{transform:translateY(-6px)}}
.err{font-family:"IBM Plex Sans Arabic";color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;font-size:14px}
/* caption */
#cap{display:none;align-items:center;gap:10px;margin:0 10px;padding:8px 10px;background:#0b1328;border:1px solid var(--line);border-radius:12px}
#cap.show{display:flex}
.spk{width:26px;height:26px;flex:none;display:grid;place-items:center;color:var(--muted)}
.spk.on{color:var(--accent)}
.spk .bars{display:flex;gap:2px;align-items:center;height:16px}
.spk .bars i{width:3px;height:5px;background:currentColor;border-radius:2px}
.spk.on .bars i{animation:eq .8s infinite}
.spk.on .bars i:nth-child(2){animation-delay:.2s}.spk.on .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:16px}}
#capText{flex:1;font-size:14px;line-height:1.6;color:#dbe4f0;max-height:4.8em;overflow-y:auto}
.cbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#16223d;color:var(--ink);display:grid;place-items:center;flex:none}
.cbtn svg{width:17px;height:17px}
/* composer */
.composer{padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:#1a2744;border:1px solid var(--line);border-radius:10px;padding:3px 6px 3px 3px;font-size:12px;color:var(--muted)}
.chip img{width:34px;height:34px;object-fit:cover;border-radius:7px}
.chip button{background:none;border:none;color:var(--muted);font-size:16px;padding:0 4px}
.row2{display:flex;align-items:flex-end;gap:6px}
textarea{flex:1;resize:none;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:16px;line-height:1.6;max-height:130px;min-height:26px;padding:6px 4px}
textarea::placeholder{color:#64748b}
.ibtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#1a2744;color:var(--ink);display:grid;place-items:center;flex:none}
.ibtn svg{width:19px;height:19px}
.ibtn.rec{background:#7f1d1d;border-color:#b91c1c;animation:pulse 1.2s infinite}
.send{background:var(--accent);border-color:var(--accent);color:#052e16}
.send:disabled{opacity:.4}
/* settings sheet */
#sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.show{display:flex}
.sh{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:16px 16px max(18px,env(safe-area-inset-bottom))}
.sh h3{margin:0 0 12px;font-size:16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;background:#0b1328;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;background:none;border:none;color:var(--muted);padding:8px;border-radius:8px;font-size:14px}
.seg button.on{background:#1f3a2b;color:#bbf7d0}
select{width:100%;background:#0b1328;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:16px}
input[type=range]{width:100%;accent-color:var(--accent)}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px}
.inp{width:100%;background:#0b1328;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:16px;direction:ltr;text-align:left}
.sh{max-height:92dvh;overflow-y:auto}
.done{width:100%;background:var(--accent);border:none;color:#052e16;font-weight:700;border-radius:12px;padding:11px;font-size:15px}
@media (max-width:600px){
  #board{padding:12px 10px 30px;border-width:6px}
  .t{font-size:19px}.h{font-size:24px}.m{font-size:19px}.box,.opts li,ul.l{font-size:18px}
  table.tb,table.jr{font-size:16px} table.jr td.acct{min-width:130px}
  .hbtn .lbl{display:none}.hbtn{width:36px;padding:0;justify-content:center}
}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20l4-4 4 4"/><path d="M7 12l3-3 2 2 4-4"/></svg></div>
  <div class="ttl"><b>المدرس الخصوصي</b><small><span class="dot" id="dot"></span><span id="status">جاهز</span></small></div>
  <button class="hbtn" id="newBtn" title="سؤال جديد"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">سؤال جديد</span></button>
  <button class="hbtn icon" id="setBtn" title="الإعدادات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</header>

<div class="wrap"><div id="board"></div></div>

<div id="cap">
  <div class="spk" id="spk"><div class="bars"><i></i><i></i><i></i></div></div>
  <div id="capText"></div>
  <button class="cbtn" id="pauseBtn" title="إيقاف مؤقت"></button>
  <button class="cbtn" id="skipBtn" title="الخطوة التالية"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6l-8.5 6L18 18zM8 6H6v12h2z"/></svg></button>
  <button class="cbtn" id="stopBtn" title="إنهاء"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
</div>

<div class="composer">
  <div class="cbox">
    <div class="chips" id="chips"></div>
    <div class="row2">
      <textarea id="q" rows="1" placeholder="اكتب سؤالك… أي سؤال وأشرحه لك على السبورة"></textarea>
      <input type="file" id="file" accept="image/*" hidden>
      <button class="ibtn" id="imgBtn" title="صورة السؤال" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-8 7"/></svg></button>
      <button class="ibtn" id="micBtn" title="اسأل بصوتك" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
      <button class="ibtn send" id="sendBtn" title="اشرح"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    </div>
  </div>
</div>

<div id="sheet"><div class="sh">
  <h3>إعدادات المدرس</h3>
  <div class="fld"><label>مفتاح Claude API (للشرح)</label><input id="kClaude" class="inp" type="password" autocomplete="off" placeholder="sk-ant-..."></div>
  <div class="fld"><label>ذكاء الشرح</label><select id="mdlSel"><option value="claude-sonnet-5-5">Claude Sonnet — سريع (مستحسن)</option><option value="claude-opus-5-5">Claude Opus — الأذكى وأبطأ</option></select></div>
  <div class="fld"><label>مفتاح Gemini API (للصوت الطبيعي)</label><input id="kGemini" class="inp" type="password" autocomplete="off" placeholder="AIza..."><div class="hint" id="gStatus">مجاني من aistudio.google.com — للصوت فقط.</div></div>
  <div class="fld"><label>مصدر الصوت</label><div class="seg" id="eng"><button data-v="gemini">Gemini</button><button data-v="azure">Azure</button><button data-v="device">الجهاز</button></div></div>
  <div class="fld" id="azFields"><label>Azure (اختياري)</label><input id="kAzure" class="inp" type="password" autocomplete="off" placeholder="KEY 1" style="margin-bottom:6px"><input id="kRegion" class="inp" autocomplete="off" autocapitalize="off" placeholder="westeurope"></div>
  <div class="hint" style="margin:-6px 0 14px">المفاتيح تنحفظ في جهازك بس.</div>
  <div class="fld"><label>مستوى الشرح</label><div class="seg" id="lvl"><button data-v="مبتدئ">مبتدئ</button><button data-v="متوسط">متوسط</button><button data-v="متقدم">متقدم</button></div></div>
  <div class="fld"><label>الصوت</label><div style="display:flex;gap:6px"><select id="voiceSel"></select><button class="hbtn" id="testVoice" style="flex:none">جرّب</button></div><div class="hint" id="voiceHint"></div></div>
  <div class="fld"><label>سرعة الكلام: <span id="rateV">1.0</span>×</label><input type="range" id="rate" min="0.7" max="1.5" step="0.1" value="1"></div>
  <div class="fld tog"><span>كتم الصوت (نص فقط)</span><input type="checkbox" id="mute"></div>
  <button class="done" id="doneBtn">تم</button>
</div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const board=$('#board');
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5v14L6 12z"/></svg>';

let tts=null;
const hasWeb=typeof window.speechSynthesis!=='undefined' && typeof window.SpeechSynthesisUtterance!=='undefined';

const S={level:'متقدم',rate:1,muted:false,webVoiceURI:'',model:'claude-sonnet-5-5',azVoice:'ar-SA-HamedNeural',engine:'gemini',gVoice:'Charon'};
const K={claude:'',gemini:'',azure:'',region:''};
try{Object.assign(K,JSON.parse(localStorage.getItem('tutor.keys')||'{}'))}catch(e){}
function saveKeys(){try{localStorage.setItem('tutor.keys',JSON.stringify(K))}catch(e){}}
try{Object.assign(S,JSON.parse(localStorage.getItem('tutor.set')||'{}'))}catch(e){}
function saveSet(){try{localStorage.setItem('tutor.set',JSON.stringify(S))}catch(e){}}

const st={msgs:[],ctx:null,queue:[],streamDone:true,playing:false,paused:false,images:[],lessonImages:[],section:null,stepN:0,ttsNoLang:false,webVoice:null,pending:null,listening:false};

/* ---------- prompts ---------- */
function sys(){return `أنت مدرس خصوصي سعودي خبير، تشرح لطالب واحد على سبورة بيضاء وبصوتك، خطوة بخطوة، كأنك جالس جنبه.
مستوى الطالب: ${S.level}.${S.level==='متقدم'?' لا تبسّط بشكل مخل، ادخل في التفاصيل الفنية والاستثناءات.':''}

أخرج الدرس بصيغة JSON Lines فقط: كل سطر كائن JSON واحد كامل يمثل خطوة. لا تكتب أي شيء آخر: لا مقدمة، لا markdown، لا علامات كود. لا تكسر الكائن على أكثر من سطر.

شكل الخطوة:
{"say":"ما تقوله بصوتك في هذه الخطوة","board":[عناصر تكتبها على السبورة في نفس اللحظة]}

عناصر السبورة المتاحة:
{"t":"heading","text":"عنوان قصير"}
{"t":"text","text":"سطر قصير","color":"blue|red|green|black"}
{"t":"list","items":["...","..."]}
{"t":"math","text":"حساب بالأرقام مثل: (500,000 - 50,000) ÷ 5 = 90,000"}
{"t":"box","text":"قاعدة أو نقطة مهمة"}

    case 'math':{wrap.append(words(el('div','m'),it.text));break;}
    case 'box':{const b=el('div','box draw');b.append(el('span','tag','★ مهم'));words(b,it.text);wrap.append(b);break;}
    case 'flow':{const f=el('div','flow');(it.nodes||[]).forEach((n,i)=>{if(i)f.append(el('span','arr w','←'));f.append(el('span','node w',n));});wrap.append(f);break;}
    case 'table':{const tw=el('div','tbwrap'),tb=el('table','tb');if(it.headers&&it.headers.length){const tr=el('tr');it.headers.forEach(h=>tr.append(words(el('th'),h)));tb.append(tr);}(it.rows||[]).forEach(r=>{const tr=el('tr');(r||[]).forEach(c=>tr.append(words(el('td'),fmt(c))));tb.append(tr);});tw.append(tb);wrap.append(tw);break;}
    case 'journal':{
      const tw=el('div','tbwrap'),tb=el('table','jr');const hr=el('tr');['البيان','مدين','دائن'].forEach(h=>hr.append(words(el('th'),h)));tb.append(hr);
      (it.lines||[]).forEach(l=>{const tr=el('tr');const isCr=l.cr!=null&&l.dr==null;const name=isCr?l.cr:l.dr;
        tr.append(words(el('td','acct'+(isCr?' cr':'')),(isCr?'إلى حـ/ ':'من حـ/ ')+(name||'')));
        tr.append(words(el('td','num'),isCr?'':fmt(l.amount)));tr.append(words(el('td','num'),isCr?fmt(l.amount):''));tb.append(tr);});
      tw.append(tb);wrap.append(tw);if(it.memo)wrap.append(words(el('div','memo'),'('+it.memo+')'));break;}
    case 'taccount':{
      const a=el('div','tac');a.append(words(el('div','tt'),it.title||''));const cols=el('div','cols');
      [['مدين',it.dr],['دائن',it.cr]].forEach(([s,rows])=>{const c=el('div','col');c.append(el('div','side',s));(rows||[]).forEach(r=>{const row=el('div','row');row.append(words(el('span'),Array.isArray(r)?r[0]:r));row.append(words(el('span','n'),Array.isArray(r)?fmt(r[1]):''));c.append(row);});cols.append(c);});
      a.append(cols);if(it.balance)a.append(words(el('div','bal'),it.balance));wrap.append(a);break;}
    case 'options':{const u=el('ul','opts');(it.items||[]).forEach(o=>{const li=el('li');const m=(o&&o.mark)||'none';if(m==='wrong')li.classList.add('wrong');words(li,o&&o.text!=null?o.text:o);if(m==='wrong')li.append(el('span','strike late'));if(m==='right')li.append(el('span','ring late'));u.append(li);});wrap.append(u);break;}

    default:{const p=el('div','t c-'+(['blue','red','green','black'].includes(it.color)?it.color:'black'));words(p,it.text??'');wrap.append(p);}

const AR=/[\u0600-\u06FF]/;
function penAt(x,y){const p=ensurePen();p.style.left=(x-4)+'px';p.style.top=(y-28)+'px';}
async function writeWord(u,ctx){
  u.classList.add('on');
  const txt=u.textContent||'';
  const per=ctx.charMs||(55/S.rate);
  const dur=Math.max(90,Math.min(1400,txt.length*per));
  const rtl=AR.test(txt);
  const from=rtl?'inset(-45% 0 -45% 100%)':'inset(-45% 100% -45% 0)';
  const br=board.getBoundingClientRect(),r=u.getBoundingClientRect();
  const y=r.bottom-br.top+board.scrollTop-6, xs=(rtl?r.right:r.left)-br.left+board.scrollLeft, xe=(rtl?r.left:r.right)-br.left+board.scrollLeft;
  const pen=ensurePen();pen.classList.add('on');penAt(xs,y);
  let a=null;
  try{a=u.animate([{clipPath:from},{clipPath:'inset(-45% 0 -45% 0)'}],{duration:dur,easing:'linear',fill:'forwards'});
      pen.animate([{left:(xs-4)+'px',top:(y-28)+'px'},{left:(xe-4)+'px',top:(y-28)+'px'}],{duration:dur,easing:'linear',fill:'forwards'});}catch(e){}
  await psleep(dur,ctx);
  if(a){try{a.finish()}catch(e){}}
}
async function drawItems(group,items,ctx){
  for(const it of (items||[])){
    let node;try{node=render(it);}catch(e){continue;}
    node.style.setProperty('--rot',((Math.random()-.5)*1.1).toFixed(2)+'deg');
    group.append(node);toBottom();
    const units=[...node.querySelectorAll('.draw, .w'),...node.querySelectorAll('.late')];
    for(const u of units){
      if(ctx.cancelled||ctx.skip){u.classList.add('on');continue;}
      if(u.classList.contains('w')){u.style.transform='translateY('+((Math.random()-.5)*2.4).toFixed(1)+'px)';toBottom();await writeWord(u,ctx);await psleep(ctx.gapMs!=null?ctx.gapMs:Math.round(70/S.rate),ctx);}
      else{u.classList.add('on');await psleep(420,ctx);}
    }
    if(!ctx.skip&&!ctx.cancelled)await psleep(180,ctx);
  }
  const p=document.getElementById('pen');if(p)p.classList.remove('on');
}

function setSpeaking(on){$('#spk').classList.toggle('on',!!on);}
function stopSpeech(){try{st.src&&st.src.stop()}catch(e){}try{tts&&tts.stop()}catch(e){}try{hasWeb&&speechSynthesis.cancel()}catch(e){}}
function speakable(t){return String(t||'')
  .replace(/(\d),(?=\d{3})/g,'$1').replace(/حـ\s*\//g,'حساب ').replace(/%/g,' بالمئة').replace(/×/g,' ضرب ').replace(/÷/g,' تقسيم ')
  .replace(/=/g,' يساوي ').replace(/[*_#`"«»()\[\]{}<>|~^]/g,' ').replace(/\s+/g,' ').trim();}
function webSpeak(text,ctx){
  return new Promise(res=>{
    let done=false,started=false;const t0=Date.now();
    const fin=()=>{if(done)return;done=true;clearInterval(iv);res();};
    const u=new SpeechSynthesisUtterance(text);
    u.lang=(st.webVoice&&st.webVoice.lang)||'ar-SA';if(st.webVoice)u.voice=st.webVoice;u.rate=S.rate;
    u.onstart=()=>{started=true;};u.onend=fin;u.onerror=fin;
    try{speechSynthesis.speak(u);}catch(e){fin();return;}
    const iv=setInterval(()=>{
      if(ctx.cancelled||ctx.skip){try{speechSynthesis.cancel()}catch(e){}fin();return;}
      if(!started&&!st.paused&&Date.now()-t0>2500&&!speechSynthesis.speaking){clearInterval(iv);psleep(est(text)*0.7,ctx).then(fin);}
    },150);
  });
}
let actx=null;

const GBASE='https://generativelanguage.googleapis.com/v1beta';

function ver(n){const m=n.match(/gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0;}
async function loadModels(){
  G.loaded=false;G.err='';G.text=[];G.tts=[];
  if(!K.gemini){updGStatus();return;}
  try{
    const r=await fetch(GBASE+'/models?pageSize=1000&key='+encodeURIComponent(K.gemini.trim()));
    const j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    const ms=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''));
    const rank=n=>ver(n)*10-(/(preview|exp)/.test(n)?1:0);
    G.text=ms.filter(n=>/^gemini-/.test(n)&&!/(tts|image|live|audio|embed|robotics|computer|veo|imagen|lyria|nano|banana)/i.test(n)).sort((a,b)=>rank(b)-rank(a)+(/lite/.test(a)?5:0)-(/lite/.test(b)?5:0));
    G.tts=ms.filter(n=>/tts/i.test(n)).sort((a,b)=>rank(b)-rank(a)+(/pro/.test(a)?3:0)-(/pro/.test(b)?3:0));
    G.loaded=true;
  }catch(e){G.err=e.message||String(e);}
  updGStatus();fillModels();
}

  else if(G.err)h.textContent='⚠️ المفتاح ما اشتغل: '+G.err;

  else h.textContent='يتحقق من المفتاح…';}
function fillModels(){const sel=document.getElementById('mdlSel');if(sel)sel.value=/opus/.test(S.model)?'claude-opus-5-5':'claude-sonnet-5-5';}
async function geminiTTS(text){
  if(!G.tts.length)throw Object.assign(new Error('no tts model'),{status:0});
  const body={contents:[{parts:[{text:text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:S.gVoice}}}}};
  const r=await gFetch('/models/'+G.tts[0]+':generateContent',body);
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;throw e;}
  const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];
  const p=parts.find(x=>x.inlineData||x.inline_data);if(!p)throw new Error('no audio');
  const d=p.inlineData||p.inline_data;const rate=parseInt(((d.mimeType||d.mime_type||'').match(/rate=(\d+)/)||[])[1]||'24000',10);
  const bin=atob(d.data);const n=bin.length>>1;
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  const ab=actx.createBuffer(1,n,rate);const ch=ab.getChannelData(0);
  for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;ch[i]=v/32768;}
  ab._gem=true;return ab;
}
async function synth(text){
  if(S.engine==='gemini'&&K.gemini&&!G.loaded)await loadModels();
  if(S.engine==='gemini'&&K.gemini){try{return await geminiTTS(text);}catch(e){st.azErr=e;st.errSrc='gemini';if(!hasAzure())return null;}}
  if((S.engine==='azure'||S.engine==='gemini')&&hasAzure()){try{return await azureTTS(text);}catch(e){st.azErr=e;st.errSrc='azure';return null;}}

}

const xmlEsc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function azureTTS(text){
  const pct=Math.round((S.rate-1)*100),rate=(pct>=0?'+':'')+pct+'%';
  const lang=(S.azVoice.match(/^[a-z]{2}-[A-Z]{2}/)||['ar-SA'])[0];
  const ssml=`<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="${lang}"><voice name="${S.azVoice}"><prosody rate="${rate}">${xmlEsc(text)}</prosody></voice></speak>`;
  const region=K.region.trim().toLowerCase().replace(/\s+/g,'');
  const r=await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`,{method:'POST',headers:{'Ocp-Apim-Subscription-Key':K.azure.trim(),'Content-Type':'application/ssml+xml','X-Microsoft-OutputFormat':'audio-24khz-48kbitrate-mono-mp3'},body:ssml});
  if(!r.ok){const e=new Error('Azure '+r.status);e.status=r.status;throw e;}

function playBuffer(buf,ctx){return new Promise(res=>{
  let done=false;const src=actx.createBufferSource();src.buffer=buf;if(buf._gem)try{src.playbackRate.value=S.rate}catch(e){}src.connect(actx.destination);st.src=src;
  const fin=()=>{if(done)return;done=true;clearInterval(iv);res();};src.onended=fin;
  const iv=setInterval(()=>{if(ctx.cancelled||ctx.skip){try{src.stop()}catch(e){}fin();}},100);
  try{if(actx.state!=='running'&&!st.paused)actx.resume();src.start(0);}catch(e){fin();}

function prefetch(step){if(cloudVoice()&&!S.muted&&step.say&&!step.audioP){step.audioP=synth(speakable(step.say));}}
function azWarn(){if(st.azWarned)return;st.azWarned=true;const e=st.azErr;const g=st.errSrc==='gemini';const m=e&&e.status===429?(g?'خلصت حصة صوت Gemini المجانية مؤقتًا':'وصلت حد Azure'):e&&(e.status===401||e.status===403||e.status===400)?(g?'مفتاح Gemini ما يسمح بالصوت':'مفتاح Azure أو المنطقة غلط'):(g?'تعذّر صوت Gemini':'تعذّر صوت Azure');$('#capText').textContent='⚠️ '+m+' — يستخدم صوت الجهاز مؤقتًا. راجع الإعدادات.';}
async function speak(text,ctx,step){
  text=speakable(text);
  if(!text||ctx.cancelled||ctx.skip)return;
  if(S.muted)return psleep(est(text),ctx);
  setSpeaking(true);
  try{
    if(cloudVoice()){
      let p=step&&step.audioP;
      if(!p){p=synth(text);if(step)step.audioP=p;}
      const buf=await p;
      if(ctx.cancelled||ctx.skip)return;
      if(buf){await playBuffer(buf,ctx);return;}
      azWarn();
    }
    if(hasWeb){await webSpeak(text,ctx);return;}
    await psleep(est(text),ctx);
  }finally{setSpeaking(false);}
}
function pickWebVoice(){
  if(!hasWeb)return;const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));
  const score=v=>(/(enhanced|premium|natural|neural|online|google|محسن)/i.test(v.name)?10:0)+(/SA/i.test(v.lang)?3:0)+(/(majed|maged|hamed|zariyah|hoda|laila|tarik|mariam)/i.test(v.name)?2:0)+(v.localService===false?1:0);
  vs.sort((a,b)=>score(b)-score(a));
  st.webVoice=vs.find(v=>v.voiceURI===S.webVoiceURI)||vs[0]||null;
}

  if(st.ctx===ctx){finishUI();}
}
function boardStrings(x,out){if(x==null)return out;if(typeof x==='string'||typeof x==='number'){out.push(String(x));return out;}
  if(Array.isArray(x)){x.forEach(v=>boardStrings(v,out));return out;}
  if(typeof x==='object'){for(const k in x){if(k==='t'||k==='type'||k==='color'||k==='mark')continue;boardStrings(x[k],out);}}return out;}
function boardChars(b){return boardStrings(b,[]).join('').replace(/\s+/g,'').length;}
function boardWords(b){return boardStrings(b,[]).join(' ').split(/\s+/).filter(Boolean).length;}
async function playStep(step,ctx){
  ctx.skip=false;
  const thinking=st.section&&st.section.querySelector('.thinking');if(thinking)thinking.remove();
  st.stepN++;
  const g=el('div','step now shown');const num=el('div','num',String(st.stepN));const body=el('div','body');g.append(num,body);
  g.title='اضغط لإعادة سماع هذه الخطوة';
  g.onclick=()=>{if(st.playing)return;const c=newCtx();st.ctx=c;$('#capText').textContent=step.say||'';$('#cap').classList.add('show');setStatus('يعيد الخطوة…','live');speak(step.say,c,step).then(()=>{if(st.ctx===c){setStatus('جاهز');}});};
  st.section.append(g);toBottom(true);
  $('#capText').textContent=step.say||'';setStatus('يشرح… خطوة '+st.stepN,'live');
  // sync writing speed to the length of the spoken audio
  ctx.charMs=null;ctx.gapMs=null;
  let spoken=0;
  if(!S.muted&&step.say){
    if(cloudVoice()){if(!step.audioP)prefetch(step);setStatus('يجهّز الصوت…','think');const b=await step.audioP;if(b)spoken=b.duration/(b._gem?S.rate:1);}
    if(!spoken)spoken=est(speakable(step.say))/1000;
  }
  const chars=boardChars(step.board),words=Math.max(1,boardWords(step.board));
  if(spoken&&chars){const total=spoken*1000*0.92-words*40-((step.board||[]).length*400);
    ctx.gapMs=40;ctx.charMs=Math.max(12,Math.min(90,total/chars));}
  setStatus('يشرح… خطوة '+st.stepN,'live');
  await Promise.all([speak(step.say,ctx,step),drawItems(body,step.board,ctx)]);
  if(!ctx.cancelled&&!ctx.skip)await psleep(350,ctx);
  g.classList.remove('now');
}
function newCtx(){if(st.ctx)st.ctx.cancelled=true;stopSpeech();st.paused=false;updPause();return {cancelled:false,skip:false};}
function finishUI(){st.playing=false;st.paused=false;updPause();setSpeaking(false);
  if(st.section&&!st.section.querySelector('.step')&&!st.section.querySelector('.err')){const th=st.section.querySelector('.thinking');if(th)th.remove();st.section.append(el('div','err','ما وصلني شرح. جرّب تعيد صياغة السؤال.'));}
  else{const th=st.section&&st.section.querySelector('.thinking');if(th)th.remove();}
  setStatus('جاهز — اسأل عن أي نقطة');$('#sendBtn').disabled=false;
  document.querySelectorAll('.step.now').forEach(x=>x.classList.remove('now'));
}
function updPause(){$('#pauseBtn').innerHTML=st.paused?ICON_PLAY:ICON_PAUSE;}

/* ---------- streaming parse ---------- */
let parsed=0;
function extractObjs(text){const out=[];let depth=0,start=-1,inStr=false,esc=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==='{'){if(depth===0)start=i;depth++;}
    else if(c==='}'&&depth>0){depth--;if(depth===0&&start>=0){out.push(text.slice(start,i+1));start=-1;}}}
  return out;}
function pushStep(o){if(!o||typeof o!=='object')return;
  if(Array.isArray(o.steps)){o.steps.forEach(pushStep);return;}
  if(o.say==null&&!o.board)return;
  if(!Array.isArray(o.board))o.board=o.board?[o.board]:[];
  st.queue.push(o);st.pushed++;prefetch(o);wake();}
function onStream(text,ctx,final){
  if(ctx.cancelled)return;
  const objs=extractObjs(String(text||''));
  for(let k=parsed;k<objs.length;k++){try{pushStep(JSON.parse(objs[k]));}catch(e){}}
  parsed=objs.length;
}
function fallbackSteps(text){
  const clean=String(text||'').replace(/```[a-z]*|```/gi,'').replace(/[#*_`]/g,'').trim();if(!clean)return;
  const paras=clean.split(/\n\s*\n|\n(?=\s*[-•\d]+[.)-]?\s)/).map(p=>p.trim()).filter(Boolean).slice(0,14);
  paras.forEach((p,i)=>pushStep({say:p,board:[i===0?{t:'heading',text:p.split(/[.\n:،]/)[0].slice(0,60)}:{t:'text',text:p}]}));
}

/* ---------- Gemini API ---------- */
function toGemini(msgs){return msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:(typeof m.content==='string'?[{type:'text',text:m.content}]:m.content).map(b=>b.type==='image'?{inline_data:{mime_type:b.source.media_type,data:b.source.data}}:{text:b.text})}));}
async function gFetch(path,body,signal){
  // key in query string -> fewer CORS surprises than a custom header
  return fetch(GBASE+path+(path.includes('?')?'&':'?')+'key='+encodeURIComponent(K.gemini.trim()),{method:'POST',signal,headers:{'content-type':'application/json'},body:JSON.stringify(body)});
}
async function gErr(res){let m='';try{const j=await res.json();m=(j.error&&j.error.message)||'';}catch(e){}const err=new Error(m||('HTTP '+res.status));err.status=res.status;return err;}
function partsText(j){const parts=(((j.candidates||[])[0]||{}).content||{}).parts||[];let t='';parts.forEach(p=>{if(p.text&&!p.thought)t+=p.text;});return t;}
function linkedAbort(signal,ms){const lc=new AbortController();const st2={timedOut:false};
  if(signal){if(signal.aborted)lc.abort();else signal.addEventListener('abort',()=>lc.abort());}
  st2.timer=setTimeout(()=>{st2.timedOut=true;lc.abort();},ms);st2.ctrl=lc;st2.clear=()=>clearTimeout(st2.timer);return st2;}
async function claudeOnce(model,msgs,onText,signal){
  st.lastModel=model;let text='';const la=linkedAbort(signal,60000);
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:la.ctrl.signal,headers:{'content-type':'application/json','x-api-key':K.claude.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:8000,stream:true,system:'أنت مدرس على سبورة. مخرجاتك دائمًا كائنات JSON بالصيغة المطلوبة في رسالة المستخدم، كل خطوة في سطر واحد، بدون أي نص خارجها.',messages:msgs})});
    if(!res.ok){let m='';try{const j=await res.json();m=(j.error&&j.error.message)||'';}catch(e){}const err=new Error(m||('HTTP '+res.status));err.status=res.status;throw err;}
    const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;let j;try{j=JSON.parse(line.slice(5).trim());}catch(e){continue;}
        if(j.type==='content_block_delta'&&j.delta&&j.delta.type==='text_delta'){la.clear();text+=j.delta.text;onText(text);}
        else if(j.type==='message_delta'&&j.delta&&j.delta.stop_reason)st.lastFinish=j.delta.stop_reason;
        else if(j.type==='error'){const e=new Error((j.error&&j.error.message)||'خطأ');e.status=/overload/i.test(e.message)?529:0;throw e;}}}
    la.clear();return text;
  }catch(e){la.clear();if(text)return text;if(la.timedOut&&!(signal&&signal.aborted)){const t=new Error('timeout');t.status='timeout';throw t;}throw e;}
}
async function callClaude(msgs,onText,signal){
  const first=/opus/.test(S.model)?'claude-opus-5-5':'claude-sonnet-5-5';
  const order=[first,first==='claude-opus-5-5'?'claude-sonnet-5-5':'claude-opus-5-5'];
  let lastErr=null;
  for(let k=0;k<order.length;k++){
    try{return await claudeOnce(order[k],msgs,onText,signal);}
    catch(e){lastErr=e;if(signal&&signal.aborted)throw e;
      const retry=e.status===529||e.status===500||e.status===503||e.status==='timeout'||e.status===404;
      if(!retry||k===order.length-1)throw e;
      $('#capText').textContent='…'+order[k]+' مزحوم، أجرّب '+order[k+1];}
  }
  throw lastErr;
}
function imgToBlock(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const m=1568;let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,m/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res({type:'image',source:{type:'base64',media_type:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]}});};im.onerror=rej;im.src=URL.createObjectURL(file);});}
function errMsg(e){const s=e&&e.status;const m=(e&&e.message)||'';
  if(s===401||/x-api-key|authentication/i.test(m))return 'مفتاح Claude غير صحيح. راجعه من الإعدادات.';
  if(/credit|balance|billing/i.test(m))return 'رصيد Claude API خلص أو ما انشحن. اشحن من console.anthropic.com ← Billing.';
  if(s===404)return 'النموذج غير متاح لحسابك: '+m;
  if(s===429)return 'وصلت حد الطلبات في الدقيقة. انتظر دقيقة وجرّب.';
  if(s===529||s===503||s==='timeout'||/overload/i.test(m))return 'Claude مزحوم الحين. جرّب بعد شوي.';
  if(/Failed to fetch|Load failed|NetworkError/i.test(m))return 'انقطع الاتصال ('+m+'). تأكد من الإنترنت وجرّب.';
  return 'صار خطأ: '+m;}

/* ---------- ask ---------- */
async function ask(question,isFollow){
  const ctx=newCtx();st.ctx=ctx;st.azWarned=false;
  if(!isFollow){st.msgs=[];board.innerHTML='';st.stepN=0;}
  const imgs=st.images.slice();st.images=[];renderChips();
  const sec=el('div','lesson');const qh=el('div','qhead'+(isFollow?' follow':''));qh.textContent=(isFollow?'سؤالك: ':'السؤال: ')+question;
  imgs.forEach(b=>{const im=el('img');im.src=URL.createObjectURL(b);qh.append(im);});
  sec.append(qh);const th=el('div','thinking');th.innerHTML='<div class="marker"><i></i><i></i><i></i></div><span>يقرأ السؤال ويجهّز الشرح…</span>';sec.append(th);
  board.append(sec);st.section=sec;toBottom(true);
  st.queue=[];st.streamDone=false;parsed=0;st.pushed=0;st.playing=true;$('#sendBtn').disabled=true;
  $('#cap').classList.add('show');$('#capText').textContent='…';setStatus('يفكّر…','think');
  runPlayer(ctx);
  let blocks=[];try{blocks=await Promise.all(imgs.map(imgToBlock));}catch(e){}
  const txt=isFollow?followPrompt(question):sys()+'\n\nسؤال الطالب:\n'+question;
  st.msgs.push({role:'user',content:blocks.length?[...blocks,{type:'text',text:txt}]:txt});
  const ac=new AbortController();ctx.abort=ac;
  try{
    const text=await callClaude(st.msgs,t=>onStream(t,ctx,false),ac.signal);
    if(!ctx.cancelled){
      onStream(text,ctx,true);
      if(!st.pushed&&text)fallbackSteps(text);
      if(text)st.msgs.push({role:'assistant',content:text});
      else{st.msgs.pop();const th2=sec.querySelector('.thinking');if(th2)th2.remove();
        const fr=st.lastFinish;sec.append(el('div','err',fr==='SAFETY'||fr==='PROHIBITED_CONTENT'?'Gemini رفض يجاوب على هذا السؤال. جرّب صياغة ثانية.':fr==='MAX_TOKENS'?'النموذج استهلك كل وقته في التفكير. اختر نموذج «flash» ثاني من الإعدادات وجرب.':'Gemini رجّع رد فاضي'+(fr?' ('+fr+')':'')+' — النموذج: '+(st.lastModel||'?')+'. جرّب نموذج ثاني من الإعدادات.'));}
    }
  }catch(e){
    if(!ctx.cancelled){st.msgs.pop();const th2=sec.querySelector('.thinking');if(th2)th2.remove();sec.append(el('div','err',errMsg(e)));}
  }finally{st.streamDone=true;wake();}
}
function submit(){
  const q=$('#q').value.trim();
  if(!q&&!st.images.length)return;
  if(!K.claude){openSettings();return;}
  if(cloudVoice())unlockAudio();
  else if(hasWeb&&!S.muted){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
  const isFollow=st.msgs.length>0;
  ask(q||'اشرح السؤال اللي في الصورة',isFollow);
  $('#q').value='';autosize();
}

/* ---------- UI wiring ---------- */
function autosize(){const t=$('#q');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,130)+'px';}
$('#q').addEventListener('input',autosize);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();submit();}});
$('#sendBtn').onclick=submit;
$('#newBtn').onclick=()=>{const c=newCtx();st.ctx=c;c.cancelled=true;st.msgs=[];st.queue=[];st.images=[];st.lessonImages=[];renderChips();$('#cap').classList.remove('show');st.playing=false;$('#sendBtn').disabled=false;setStatus('جاهز');showEmpty();$('#q').placeholder='اكتب سؤالك… أي سؤال وأشرحه لك على السبورة';};
$('#pauseBtn').onclick=()=>{
  st.paused=!st.paused;updPause();
  try{if(actx){st.paused?actx.suspend():actx.resume();}}catch(e){}
  try{if(hasWeb){st.paused?speechSynthesis.pause():speechSynthesis.resume();}}catch(e){}
  setStatus(st.paused?'متوقف مؤقتًا':'يشرح…',st.paused?'':'live');
};
$('#skipBtn').onclick=()=>{if(st.ctx){st.paused=false;updPause();st.ctx.skip=true;stopSpeech();}};
$('#stopBtn').onclick=()=>{if(st.ctx){const c=st.ctx;c.cancelled=true;try{c.abort&&c.abort.abort()}catch(e){}st.queue=[];stopSpeech();st.streamDone=true;wake();
  document.querySelectorAll('#board .w:not(.on),#board .draw:not(.on),#board .late:not(.on)').forEach(x=>x.classList.add('on'));finishUI();}};
updPause();

/* images */
function renderChips(){const c=$('#chips');c.innerHTML='';st.images.forEach((b,i)=>{const ch=el('div','chip');const im=el('img');im.src=URL.createObjectURL(b);const x=el('button',null,'×');x.onclick=()=>{st.images.splice(i,1);renderChips();};ch.append(im,el('span',null,'صورة السؤال'),x);c.append(ch);});}
$('#imgBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(f){st.images=[f];renderChips();}e.target.value='';};

/* settings */
const AZ_VOICES=[['ar-SA-HamedNeural','حامد — سعودي'],['ar-SA-ZariyahNeural','زارية — سعودية'],['ar-AE-HamdanNeural','حمدان — إماراتي'],['ar-KW-FahedNeural','فهد — كويتي']];
const G_VOICES=[['Charon','رجالي هادئ (شارون)'],['Orus','رجالي ثابت (أوروس)'],['Puck','رجالي حيوي (بَك)'],['Fenrir','رجالي متحمس (فنرير)'],['Kore','نسائي واضح (كور)'],['Aoede','نسائي ناعم (إيودي)'],['Zephyr','نسائي مشرق (زيفر)']];
function fillVoices(){
  const sel=$('#voiceSel');sel.innerHTML='';const hint=$('#voiceHint');sel.disabled=false;
  if(S.engine==='gemini'){G_VOICES.forEach(([v,l])=>{const o=el('option',null,l);o.value='g:'+v;sel.append(o);});sel.value='g:'+S.gVoice;hint.textContent=K.gemini?'صوت Gemini الطبيعي، يتكلم باللهجة السعودية. اضغط «جرّب».':'حط مفتاح Gemini فوق.';}
  else if(S.engine==='azure'){AZ_VOICES.forEach(([v,l])=>{const o=el('option',null,l);o.value='a:'+v;sel.append(o);});sel.value='a:'+S.azVoice;hint.textContent=hasAzure()?'صوت Azure. اضغط «جرّب».':'حط مفتاح Azure والمنطقة فوق.';}
  else if(hasWeb){pickWebVoice();const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));
    if(vs.length){vs.forEach(v=>{const o=el('option',null,v.name+' ('+v.lang+')');o.value='w:'+v.voiceURI;sel.append(o);});if(st.webVoice)sel.value='w:'+st.webVoice.voiceURI;}
    else{sel.append(el('option',null,'صوت الجهاز'));sel.disabled=true;}hint.textContent='صوت الجهاز (ماجد).';}
  else{sel.append(el('option',null,'غير متاح'));sel.disabled=true;hint.textContent='';}
  $('#azFields').style.display=S.engine==='azure'?'':'none';
}
$('#testVoice').onclick=()=>{unlockAudio();stopSpeech();st.azWarned=false;speak('هلا والله، أنا مدرسك الخصوصي. خلنا نبدأ الدرس خطوة خطوة، وإذا ما فهمت أي نقطة اسألني على طول.',{cancelled:false,skip:false});};
$('#voiceSel').onchange=e=>{const v=e.target.value;if(v.startsWith('g:'))S.gVoice=v.slice(2);else if(v.startsWith('a:'))S.azVoice=v.slice(2);else if(v.startsWith('w:')){S.webVoiceURI=v.slice(2);pickWebVoice();}saveSet();};
['kClaude','kGemini','kAzure','kRegion'].forEach((id,i)=>{const k=['claude','gemini','azure','region'][i];const inp=document.getElementById(id);inp.value=K[k]||'';inp.addEventListener('change',()=>{K[k]=inp.value.trim();saveKeys();if(k==='gemini'){G.loaded=false;updGStatus();loadModels();}fillVoices();});});
$('#mdlSel').onchange=e=>{S.model=e.target.value;saveSet();};
document.querySelectorAll('#eng button').forEach(b=>b.onclick=()=>{S.engine=b.dataset.v;saveSet();syncSettings();fillVoices();});
function openSettings(){fillVoices();syncSettings();updGStatus();fillModels();$('#sheet').classList.add('show');}
function syncSettings(){
  document.querySelectorAll('#lvl button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.level));
  $('#rate').value=S.rate;$('#rateV').textContent=Number(S.rate).toFixed(1);$('#mute').checked=!!S.muted;document.querySelectorAll('#eng button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.engine));
}
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{S.level=b.dataset.v;saveSet();syncSettings();});
$('#rate').oninput=e=>{S.rate=parseFloat(e.target.value);$('#rateV').textContent=S.rate.toFixed(1);saveSet();};
$('#mute').onchange=e=>{S.muted=e.target.checked;if(S.muted)stopSpeech();saveSet();};
$('#setBtn').onclick=openSettings;
$('#doneBtn').onclick=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('show');};
if(hasWeb){try{speechSynthesis.onvoiceschanged=()=>{pickWebVoice();if($('#sheet').classList.contains('show'))fillVoices();};pickWebVoice();}catch(e){}}

/* ---------- init ---------- */
$('#imgBtn').hidden=false;
if(!K.claude){showEmpty('أول مرة؟ اضغط زر الإعدادات فوق وحط مفتاح Claude (ومفتاح Gemini للصوت).');setTimeout(openSettings,400);}
else showEmpty();
if(K.gemini)loadModels();
setStatus('جاهز');
})();
